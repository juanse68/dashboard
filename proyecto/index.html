<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Metadatos básicos -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Título de la aplicación -->
  <title>Temu Clone</title>

  <!-- Enlace a estilos principales -->
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 
    Splash opcional: se oculta en main.js tras la carga. 
    Si no quieres splash, puedes eliminar todo este div.
  -->
  <div id="splash">
    <img src="assets/splash.png" alt="Splash Temu Clone" />
  </div>

  <!-- 
    Contenedor dinámico: aquí inyectamos Login, Registro, Dashboard, Carrito, Perfil…
  -->
  <main id="app"></main>

  <!-- 
    Navegación inferior estilo Temu: 
    Cada botón dispara navigate(page) en main.js
  -->
  <nav class="bottom-nav">
    <button data-page="home" class="active">Inicio</button>
    <button data-page="categories">Categorías</button>
    <button data-page="profile">Tú</button>
    <button data-page="cart">Carrito <span id="cart-count">0</span></button>
  </nav>

  <!-- Script principal: enrutamiento y lógica global -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
